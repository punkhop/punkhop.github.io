<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order confirmed — Jetpack Comedy</title>
  <meta name="description" content="Your Jetpack Comedy order is confirmed.">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at top, rgba(228, 0, 43, 0.18), transparent 34%),
        linear-gradient(180deg, #120c0d 0%, #0b0708 100%);
      color: #faf7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      width: min(100%, 720px);
      background: rgba(20, 16, 16, 0.94);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 28px 70px rgba(0,0,0,0.35);
    }

    .eyebrow {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ff6b85;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .lede {
      margin: 1rem 0 0;
      color: #b9adad;
      line-height: 1.65;
      max-width: 42rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.9rem;
      margin-top: 1.6rem;
    }

    .item {
      padding: 1rem 1.1rem;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8f8183;
      margin-bottom: 0.35rem;
      font-weight: 700;
    }

    .value {
      font-size: 1rem;
      font-weight: 600;
      color: #fff7f7;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 1.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0.95rem 1.25rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: #e4002b;
      color: #fff;
    }

    .btn-primary:hover { background: #c8001f; }

    .btn-secondary {
      border: 1px solid rgba(255,255,255,0.12);
      color: #f6eeee;
      background: transparent;
    }

    .btn-secondary:hover { border-color: rgba(255,255,255,0.26); }
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Order confirmed</div>
    <h1 id="heading">You’re in.</h1>
    <p class="lede" id="lede">
      Your Jetpack Comedy checkout is complete. Watch your inbox for ticket and show details.
    </p>

    <section class="grid" id="cart"></section>
    <section class="grid" id="details"></section>

    <div class="actions">
      <a class="btn btn-primary" id="event-link" href="/index-new.html">Back to shows</a>
      <a class="btn btn-secondary" href="/index-new.html">Browse more dates</a>
    </div>
  </main>

  <script>
    (function() {
      var API_ROOT = "https://jetbook.co/api/1.1/obj";
      var params = new URLSearchParams(window.location.search);
      var eventSlug = params.get("event") || "";
      var buyerName = params.get("name") || "Guest";
      var buyerEmail = params.get("email") || "";
      var qty = params.get("qty") || "";
      var total = params.get("total") || "";
      var checkoutDraft = null;

      try {
        checkoutDraft = JSON.parse(window.sessionStorage.getItem("jetpackCheckoutDraft") || "null");
      } catch (error) {
        checkoutDraft = null;
      }

      if ((!eventSlug || !buyerEmail || !qty || !total) && checkoutDraft && checkoutDraft.payload) {
        eventSlug = eventSlug || checkoutDraft.eventSlug || "";
        buyerName = buyerName || ((checkoutDraft.payload.first_name || "") + " " + (checkoutDraft.payload.last_name || "")).trim();
        buyerEmail = buyerEmail || checkoutDraft.payload.email || "";
        qty = qty || String((checkoutDraft.totals && checkoutDraft.totals.totalQty) || "");
        total = total || String((checkoutDraft.totals && checkoutDraft.totals.total) || "");
      }

      var details = [];
      if (buyerName) details.push({ label: "Name", value: buyerName });
      if (buyerEmail) details.push({ label: "Email", value: buyerEmail });
      if (qty) details.push({ label: "Tickets", value: qty });
      if (total) details.push({ label: "Estimated total", value: "$" + Number(total).toFixed(2) });
      if (eventSlug) details.push({ label: "Event", value: eventSlug });

      document.getElementById("heading").textContent = buyerName ? buyerName.split(" ")[0] + ", you’re in." : "You’re in.";

      if (eventSlug) {
        var eventUrl = "/event.html?event=" + encodeURIComponent(eventSlug);
        document.getElementById("event-link").href = eventUrl;
        document.getElementById("event-link").textContent = "View event details";
      }

      if (checkoutDraft && Array.isArray(checkoutDraft.cart) && checkoutDraft.cart.length) {
        document.getElementById("cart").innerHTML = checkoutDraft.cart.map(function(item) {
          return (
            '<div class="item">' +
              '<span class="label">' + item.quantity + ' x ticket</span>' +
              '<div class="value">' + item.name + ' · $' + Number(item.price || 0).toFixed(2) + '</div>' +
            '</div>'
          );
        }).join("");
      }

      document.getElementById("details").innerHTML = details.map(function(item) {
        return (
          '<div class="item">' +
            '<span class="label">' + item.label + '</span>' +
            '<div class="value">' + item.value + '</div>' +
          '</div>'
        );
      }).join("");

      if (eventSlug) {
        fetch(
          API_ROOT + "/V2_Event?constraints=" +
          encodeURIComponent(JSON.stringify([{ key: "Slug", constraint_type: "equals", value: eventSlug }]))
        )
          .then(function(response) { return response.json(); })
          .then(function(data) {
            var event = data && data.response && data.response.results && data.response.results[0];
            if (!event || !event.Name) return;

            document.title = "Order confirmed — " + event.Name;
            document.getElementById("lede").textContent =
              "Your Jetpack Comedy checkout is complete for " + event.Name + ". Watch your inbox for ticket and show details.";
          })
          .catch(function(error) {
            console.warn("Unable to load event summary:", error);
          });
      }
    })();
  </script>
</body>
</html>
